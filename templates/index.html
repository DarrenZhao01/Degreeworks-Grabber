<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DegreeWorks Course Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
</head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-50HK1LKTSN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-50HK1LKTSN');
</script>
<body class="initial-view"> <div class="app-container">
        <div class="input-column">
            <div class="input-elements-content">
                <header class="text-center mb-4"> <i class="fas fa-graduation-cap fa-3x text-primary mb-3"></i>
                    <h1>DegreeWorks Course Finder</h1>
                    <p class="lead text-muted">Find available sections for your required courses.</p>
                    <a href="/tutorial" class="lead text-muted">View Tutorial</a>
                </header>

                <div class="row justify-content-center w-100"> <div class="col-lg-10 col-xl-10"> <div class="card shadow-sm mb-2">
                            <div class="card-body">
                                <form id="courseForm">
                                    <div class="mb-3">
                                        <label for="inputText" class="form-label">
                                            <i class="fas fa-paste me-2"></i>Paste your DegreeWorks list of required courses
                                        </label>
                                        <textarea class="form-control" id="inputText" rows="4" placeholder="e.g., COMPSCI 111, 121, STATS 67, 68, MATH 2A, 2B" required></textarea>
                                    </div>

                                    <div class="row g-3 mb-3">
                                        <div class="col-md-6">
                                            <label for="year" class="form-label">
                                                <i class="fas fa-calendar-alt me-2"></i>Year
                                            </label>
                                            <input type="number" class="form-control" id="year" placeholder="YYYY" min="2000" max="2025" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="quarter" class="form-label">
                                                <i class="fas fa-cloud-sun-rain me-2"></i>Quarter
                                            </label>
                                            <select class="form-select" id="quarter" required>
                                                <option value="" disabled selected>Select Quarter</option>
                                                <option value="Fall">Fall</option>
                                                <option value="Winter">Winter</option>
                                                <option value="Spring">Spring</option>
                                                <option value="Summer1">Summer Session 1</option>
                                                <option value="Summer10wk">Summer Session 10-wk</option>
                                                <option value="Summer2">Summer Session 2</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="fas fa-search me-2"></i>Find Courses
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="text-muted mt-2 text-center"><small>Searches with <a href="https://icssc.link/about-anteaterapi" target="_blank" rel="noopener">Anteater API</a> for Courses. <br>Double check results for accuracy.</small></p>
            </div>
        </div>

        <div class="output-column">
            <div class="output-column-content-wrapper">
                <div class="progress-log-display">
                    </div>

                <div class="results-display d-none"> <div class="text-center mb-3">
                        <small>
                            Data from <a href="https://icssc.link/about-anteaterapi" target="_blank" rel="noopener">Anteater API</a>
                        </small>
                    </div>

                    <div class="filter-controls-container">
                        <div class="collapse-controls">
                            <button class="btn btn-sm btn-outline-secondary" id="expandAllBtn">
                                <i class="fas fa-plus-square me-1"></i>Expand All
                            </button>
                            <button class="btn btn-sm btn-outline-secondary ms-2" id="collapseAllBtn">
                                <i class="fas fa-minus-square me-1"></i>Collapse All
                            </button>
                        </div>

                        <ul class="nav nav-tabs" id="filterTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="available-tab" data-bs-toggle="tab" data-bs-target="#available-courses" type="button" role="tab" aria-controls="available-courses" aria-selected="true">
                                <i class="fas fa-check-circle me-1 text-success"></i> Available
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="unavailable-tab" data-bs-toggle="tab" data-bs-target="#unavailable-courses" type="button" role="tab" aria-controls="unavailable-courses" aria-selected="false">
                                    <i class="fas fa-times-circle me-1 text-danger"></i> Unavailable
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="all-tab" data-bs-toggle="tab" data-bs-target="#all-courses" type="button" role="tab" aria-controls="all-courses" aria-selected="false">
                                <i class="fas fa-list me-1"></i> All
                                </button>
                            </li>
                        </ul>
                    </div>

                    <div class="tab-content pt-3" id="filterTabContent">
                        <div class="tab-pane fade show active" id="available-courses" role="tabpanel" aria-labelledby="available-tab">
                        </div>
                        <div class="tab-pane fade" id="unavailable-courses" role="tabpanel" aria-labelledby="unavailable-tab">
                        </div>
                        <div class="tab-pane fade" id="all-courses" role="tabpanel" aria-labelledby="all-tab">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="alertArea" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050;"></div>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLScHexfKXyuz4EZP2hCR1HNil5yLXENDuDRfMkIm6WDJB3wbBA/viewform?usp=header" class="position-fixed top-0 end-0 p-3 text-muted text-decoration-none feedback-link" target="_blank" rel="noopener">Submit feedback</a>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="static/script.js" defer></script>

</body>
</html>
